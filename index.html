<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>ParticipantsSelect</title>

<style>
body {
  font-family: system-ui;
  background:#0b1220;
  color:white;
  margin:0;
  padding:30px;
}

.container {
  max-width:900px;
  margin:auto;
}

.card {
  background:#111827;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

button {
  padding:8px 12px;
  margin:4px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

input {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

h1 { margin-bottom:10px }

.queue {
  margin-bottom:15px;
}
</style>

</head>

<body>

<div class="container">

<h1>ParticipantsSelect</h1>

<div class="card">
  <input id="name" placeholder="Queue name">
  <select id="mode">
    <option value="group">Group</option>
    <option value="solo">Solo</option>
  </select>
  <button onclick="createQueue()">Create</button>
</div>

<h2>Pinned</h2>
<div id="pinned"></div>

<h2>All queues</h2>
<div id="list"></div>

<div style="opacity:0.6;margin-top:40px">
Made by oleksandr<br>
Made by ChatGPT<br>
contributors: susterok
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDfuH5iHjtiaB4bd5Z0YVzKFM0U4hQsO-w",
  authDomain: "partisel.firebaseapp.com",
  databaseURL: "https://partisel-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "partisel"
});

const db = getDatabase(app);

// CREATE
window.createQueue = async () => {
  const name = document.getElementById("name").value;
  const mode = document.getElementById("mode").value;

  if (!name) return alert("enter name");

  const q = push(ref(db, "queues"));

  await set(q, {
    name,
    mode,
    pinned:false,
    createdAt: Date.now()
  });
};

// PIN WITH CODE 1444
window.togglePin = async (id, current) => {
  const code = prompt("Enter PIN");

  if (code !== "1444") {
    alert("wrong pin");
    return;
  }

  await update(ref(db, "queues/"+id), {
    pinned: !current
  });
};

// OPEN
window.openQueue = id => {
  location.href = "queue.html?id="+id;
};

// RENDER
onValue(ref(db,"queues"), snap=>{
  const data = snap.val() || {};

  const pinned = document.getElementById("pinned");
  const list = document.getElementById("list");

  pinned.innerHTML = "";
  list.innerHTML = "";

  for (const id in data) {
    const q = data[id];

    const div = document.createElement("div");
    div.className="card queue";

    div.innerHTML = `
      <b>${q.name}</b> (${q.mode})
      <br>
      <button onclick="openQueue('${id}')">Open</button>
      <button onclick="togglePin('${id}', ${q.pinned})">
        ${q.pinned ? "Unpin":"Pin"}
      </button>
    `;

    if (q.pinned) pinned.appendChild(div);
    else list.appendChild(div);
  }
});
</script>

</body>
</html>
