<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queue</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background:
    radial-gradient(circle at top left, rgba(59,130,246,0.2), transparent),
    #060c18;
  color:white;
}

.container {
  max-width:900px;
  margin:auto;
  padding:30px;
}

.card {
  background: rgba(17,24,39,0.9);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  backdrop-filter: blur(10px);
}

h1 {
  margin:0 0 10px;
  font-size:42px;
}

.badge {
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  margin-right:6px;
  font-size:13px;
}

button {
  border:none;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  color:white;
  font-weight:600;
}

.blue { background:#3b82f6 }
.green { background:#22c55e }
.red { background:#ef4444 }
.gray { background:#374151 }

.group {
  margin-top:15px;
}

.user {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-radius:12px;
  margin:8px 0;
  background: rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
}

.user.me {
  border:1px solid #3b82f6;
}

.user-left {
  display:flex;
  gap:12px;
  align-items:center;
}

.num {
  width:30px;
  height:30px;
  border-radius:999px;
  background:rgba(59,130,246,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.footer {
  opacity:0.6;
  margin-top:40px;
}
</style>

</head>

<body>

<div class="container">

<a href="index.html">← Back</a>

<div class="card">
  <h1 id="title"></h1>
  <div id="meta"></div>
</div>

<div class="card">
  <button class="gray" onclick="login()">Login</button>
  <button class="gray" onclick="logout()">Logout</button>
  <button class="blue" onclick="copyLink()">Copy link</button>
</div>

<div id="controls"></div>
<div id="content"></div>

<div class="footer">
  Made by oleksandr<br>
  Made by ChatGPT<br>
  contributors: susterok
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDfuH5iHjtiaB4bd5Z0YVzKFM0U4hQsO-w",
  authDomain: "partisel.firebaseapp.com",
  databaseURL: "https://partisel-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "partisel"
});

const db = getDatabase(app);

const id = new URLSearchParams(location.search).get("id");

const uid = localStorage.getItem("uid") || crypto.randomUUID();
localStorage.setItem("uid", uid);

let identity = JSON.parse(localStorage.getItem("identity") || "null");

// LOGIN
window.login = () => {
  const name = prompt("Name");
  const pin = prompt("PIN");
  if (!name || !pin) return;

  identity = {name, pin};
  localStorage.setItem("identity", JSON.stringify(identity));
};

// LOGOUT
window.logout = () => {
  identity = null;
  localStorage.removeItem("identity");
};

// COPY LINK
window.copyLink = () => {
  navigator.clipboard.writeText(location.href);
  alert("copied");
};

// MOVE
async function move(path, index, dir) {
  if (!identity) return alert("login");

  const snap = await get(ref(db, path));
  const data = snap.val();
  if (!data) return;

  const items = Object.entries(data).sort((a,b)=>a[1].createdAt-b[1].createdAt);

  const next = index + dir;
  if (next<0 || next>=items.length) return;

  const [k1,v1] = items[index];
  const [k2,v2] = items[next];

  if (v1.name!==identity.name || v1.pin!==identity.pin || v1.uid!==uid) {
    alert("only yourself");
    return;
  }

  await update(ref(db, path+"/"+k1), {createdAt:v2.createdAt});
  await update(ref(db, path+"/"+k2), {createdAt:v1.createdAt});
}

// ADD SOLO
window.add = async () => {
  if (!identity) return alert("login");

  await push(ref(db, `queues/${id}/participants`), {
    ...identity,
    uid,
    createdAt: Date.now()
  });
};

// DELETE
window.del = async () => {
  if (!identity) return;

  const snap = await get(ref(db, `queues/${id}/participants`));
  const data = snap.val();

  for (const k in data) {
    const p = data[k];
    if (p.name===identity.name && p.pin===identity.pin && p.uid===uid) {
      await remove(ref(db, `queues/${id}/participants/${k}`));
    }
  }
};

// GROUP
window.createGroup = async () => {
  const name = prompt("Group name");
  if (!name) return;

  await update(ref(db, `queues/${id}/groups`), {[name]:true});
};

window.join = async g => {
  if (!identity) return;

  await push(ref(db, `queues/${id}/members/${g}`), {
    ...identity,
    uid,
    createdAt: Date.now()
  });
};

window.leave = async g => {
  const snap = await get(ref(db, `queues/${id}/members/${g}`));
  const data = snap.val();

  for (const k in data) {
    const p = data[k];
    if (p.name===identity.name && p.pin===identity.pin && p.uid===uid) {
      await remove(ref(db, `queues/${id}/members/${g}/${k}`));
    }
  }
};

// RENDER
onValue(ref(db, `queues/${id}`), snap=>{
  const q = snap.val();
  if (!q) return;

  document.getElementById("title").innerText = q.name;

  document.getElementById("meta").innerHTML = `
    <span class="badge">${q.mode}</span>
  `;

  const controls = document.getElementById("controls");
  const content = document.getElementById("content");

  controls.innerHTML="";
  content.innerHTML="";

  // SOLO
  if (q.mode==="solo") {
    controls.innerHTML=`
      <div class="card">
        <button class="blue" onclick="add()">Add me</button>
        <button class="red" onclick="del()">Delete</button>
      </div>
    `;

    const items = q.participants
      ? Object.entries(q.participants).sort((a,b)=>a[1].createdAt-b[1].createdAt)
      : [];

    items.forEach(([k,p],i)=>{
      const div = document.createElement("div");
      div.className="user";

      if (identity && p.name===identity.name) div.classList.add("me");

      div.innerHTML=`
        <div class="user-left">
          <div class="num">${i+1}</div>
          <div>${p.name}</div>
        </div>
        <div>
          <button class="gray" onclick="move('queues/${id}/participants',${i},-1)">↑</button>
          <button class="gray" onclick="move('queues/${id}/participants',${i},1)">↓</button>
        </div>
      `;

      content.appendChild(div);
    });
  }

  // GROUP
  else {
    controls.innerHTML=`
      <div class="card">
        <button class="green" onclick="createGroup()">Create group</button>
      </div>
    `;

    const groups = q.groups || {};
    const members = q.members || {};

    for (const g in groups) {
      const card = document.createElement("div");
      card.className="card";

      card.innerHTML = `<h3>${g}</h3>`;

      const joinBtn = document.createElement("button");
      joinBtn.className="blue";
      joinBtn.innerText="Join";
      joinBtn.onclick=()=>join(g);

      const leaveBtn = document.createElement("button");
      leaveBtn.className="red";
      leaveBtn.innerText="Leave";
      leaveBtn.onclick=()=>leave(g);

      card.appendChild(joinBtn);
      card.appendChild(leaveBtn);

      const items = members[g]
        ? Object.entries(members[g]).sort((a,b)=>a[1].createdAt-b[1].createdAt)
        : [];

      items.forEach(([k,p],i)=>{
        const user = document.createElement("div");
        user.className="user";

        if (identity && p.name===identity.name) user.classList.add("me");

        user.innerHTML=`
          <div class="user-left">
            <div class="num">${i+1}</div>
            <div>${p.name}</div>
          </div>
          <div>
            <button class="gray" onclick="move('queues/${id}/members/${g}',${i},-1)">↑</button>
            <button class="gray" onclick="move('queues/${id}/members/${g}',${i},1)">↓</button>
          </div>
        `;

        card.appendChild(user);
      });

      content.appendChild(card);
    }
  }
});
</script>

</body>
</html>
