<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queue</title>

<style>
body {
  background:#0b1220;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.card {
  background:#111827;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

button { margin:4px; padding:6px 10px }
</style>

</head>

<body>

<a href="index.html">← Back</a>

<h1 id="title"></h1>

<div id="controls"></div>
<div id="content"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDfuH5iHjtiaB4bd5Z0YVzKFM0U4hQsO-w",
  databaseURL: "https://partisel-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "partisel"
});

const db = getDatabase(app);

const id = new URLSearchParams(location.search).get("id");

// MOVE
async function move(path, index, dir) {
  const snap = await get(ref(db, path));
  const data = snap.val();
  if (!data) return;

  const items = Object.entries(data).sort((a,b)=>a[1].createdAt-b[1].createdAt);

  const next = index + dir;
  if (next < 0 || next >= items.length) return;

  const [k1,v1] = items[index];
  const [k2,v2] = items[next];

  await update(ref(db, path+"/"+k1), {createdAt:v2.createdAt});
  await update(ref(db, path+"/"+k2), {createdAt:v1.createdAt});
}

// SOLO
window.addSolo = async () => {
  const name = prompt("Name");
  if (!name) return;

  await push(ref(db, `queues/${id}/participants`), {
    name,
    createdAt: Date.now()
  });
};

window.removeSolo = async () => {
  const name = prompt("Name");

  const snap = await get(ref(db, `queues/${id}/participants`));
  const data = snap.val();

  for (const k in data) {
    if (data[k].name === name) {
      await remove(ref(db, `queues/${id}/participants/${k}`));
    }
  }
};

// GROUP
window.createGroup = async () => {
  const name = prompt("Group name");
  if (!name) return;

  await update(ref(db, `queues/${id}/groups`), {
    [name]: true
  });
};

window.joinGroup = async (group) => {
  const name = prompt("Name");
  if (!name) return;

  await push(ref(db, `queues/${id}/members/${group}`), {
    name,
    createdAt: Date.now()
  });
};

window.leaveGroup = async (group) => {
  const name = prompt("Name");

  const snap = await get(ref(db, `queues/${id}/members/${group}`));
  const data = snap.val();

  for (const k in data) {
    if (data[k].name === name) {
      await remove(ref(db, `queues/${id}/members/${group}/${k}`));
    }
  }
};

// RENDER
onValue(ref(db, `queues/${id}`), snap => {
  const q = snap.val();
  if (!q) return;

  document.getElementById("title").textContent = q.name;

  const controls = document.getElementById("controls");
  const content = document.getElementById("content");

  controls.innerHTML = "";
  content.innerHTML = "";

  if (q.mode === "solo") {
    controls.innerHTML = `
      <button onclick="addSolo()">Add</button>
      <button onclick="removeSolo()">Remove</button>
    `;

    const items = q.participants
      ? Object.entries(q.participants).sort((a,b)=>a[1].createdAt-b[1].createdAt)
      : [];

    items.forEach(([k,p],i)=>{
      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `
        ${i+1}. ${p.name}
        <br>
        <button onclick="move('queues/${id}/participants',${i},-1)">↑</button>
        <button onclick="move('queues/${id}/participants',${i},1)">↓</button>
      `;

      content.appendChild(div);
    });
  }

  else {
    controls.innerHTML = `<button onclick="createGroup()">Create group</button>`;

    const groups = q.groups || {};
    const members = q.members || {};

    for (const g in groups) {
      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `<h3>${g}</h3>`;

      const join = document.createElement("button");
      join.innerText="Join";
      join.onclick=()=>joinGroup(g);

      const leave = document.createElement("button");
      leave.innerText="Leave";
      leave.onclick=()=>leaveGroup(g);

      div.appendChild(join);
      div.appendChild(leave);

      const items = members[g]
        ? Object.entries(members[g]).sort((a,b)=>a[1].createdAt-b[1].createdAt)
        : [];

      items.forEach(([k,p],i)=>{
        const user = document.createElement("div");

        user.innerHTML = `
          ${i+1}. ${p.name}
          <button onclick="move('queues/${id}/members/${g}',${i},-1)">↑</button>
          <button onclick="move('queues/${id}/members/${g}',${i},1)">↓</button>
        `;

        div.appendChild(user);
      });

      content.appendChild(div);
    }
  }
});
</script>

</body>
</html>
